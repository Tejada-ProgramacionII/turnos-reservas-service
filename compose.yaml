# Servicio de turnos con su base PostgreSQL. Los secretos llegan desde .env (copiar .env.example).
# Los datos de la base se pueden sobrescribir con DB_NAME, DB_USERNAME, DB_PASSWORD y DB_PORT;
# los valores por defecto coinciden con application.properties.
# El nombre del proyecto es fijo para reutilizar el contenedor y el volumen de turnos-db
# aunque se levante desde otra carpeta (por ejemplo, un worktree).
name: turnos-reservas-service

services:
  turnos-db:
    image: postgres:17
    container_name: turnos-db
    environment:
      POSTGRES_DB: ${DB_NAME:-turnos}
      POSTGRES_USER: ${DB_USERNAME:-turnos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-turnos}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - turnos-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - turnos

  turnos:
    build: .
    container_name: turnos
    depends_on:
      turnos-db:
        condition: service_healthy
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://turnos-db:5432/${DB_NAME:-turnos}
      DB_USERNAME: ${DB_USERNAME:-turnos}
      DB_PASSWORD: ${DB_PASSWORD:-turnos}
    # Adentro escucha en el 8080; afuera en el 8081 para convivir con el catálogo.
    ports:
      - "8081:8080"
    networks:
      - turnos

# Red propia fuera de 172.17.x, que es donde está la cátedra (ZeroTier).
networks:
  turnos:
    ipam:
      config:
        - subnet: 10.21.0.0/24

volumes:
  turnos-db-data:
