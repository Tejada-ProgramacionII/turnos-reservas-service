spring.application.name=turnos-reservas-service

# PostgreSQL (los valores se pueden sobrescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/turnos}
spring.datasource.username=${DB_USERNAME:turnos}
spring.datasource.password=${DB_PASSWORD:turnos}

# Catálogo (CU-05 del catálogo): turnos lo consulta por REST con el JWT del usuario.
# Sin esta variable de entorno el servicio no arranca.
catalogo.base-url=${CATALOGO_BASE_URL:}

# El esquema lo crean las migraciones de Flyway (src/main/resources/db/migration).
# Hibernate solo valida que las entidades coincidan con las tablas.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Errores de validación: la respuesta 400 indica qué campos fallaron (CU-01, flujo 2a)
spring.web.error.include-binding-errors=always

# JWT de usuario (CU-02): firmado con HS512. El secreto (Base64, al menos 64 bytes)
# llega solo por la variable de entorno JWT_SECRET; nunca se guarda en el repo.
jwt.secret=${JWT_SECRET}
jwt.token-validity-seconds=86400

# Integración con la cátedra: la URL y el JWT técnico no van al repositorio.
# Sin estas variables de entorno el servicio no arranca.
catedra.base-url=${CATEDRA_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}

# Kafka de la cátedra (CU-05 y CU-06): broker, topic de acciones de turnos y consumer group
# propio de este servicio. Los valores salen de la integración técnica y no van al repositorio.
# Sin estas variables de entorno el servicio no arranca.
catedra.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.topic-acciones=${KAFKA_TOPIC_ACCIONES:}
catedra.kafka.grupo=${KAFKA_GRUPO:}
spring.kafka.bootstrap-servers=${catedra.kafka.bootstrap-servers}
spring.kafka.consumer.group-id=${catedra.kafka.grupo}
# Un grupo nuevo lee desde el principio: un evento publicado antes del primer arranque no se pierde.
spring.kafka.consumer.auto-offset-reset=earliest
# El offset de cada mensaje se confirma cuando el listener termina, después de guardar el efecto (D-06).
spring.kafka.listener.ack-mode=record
