spring.application.name=turnos-reservas-service

# Base en memoria SOLO para tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Valor ficticio: los tests nunca llaman al catálogo
catalogo.base-url=http://catalogo.test

# Los tests usan las mismas migraciones que la base real
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

# Secreto JWT SOLO para los tests (texto de prueba en Base64, no es una clave real)
jwt.secret=Y2xhdmUtZGUtcHJ1ZWJhLXNvbG8tcGFyYS1sb3MtdGVzdHMtZGVsLXNlcnZpY2lvLWRlLXR1cm5vcy1uby11c2Fy
jwt.token-validity-seconds=86400

# Valores ficticios: los tests nunca llaman a la cátedra
catedra.base-url=http://catedra.test
catedra.jwt=jwt-de-prueba
